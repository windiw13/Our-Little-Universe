<!-- MODAL SEND HUG -->
<div id="hugModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Kirim Pelukan ke Rama 🤍</h3>
            <button class="close-modal" id="closeHugModal">✕</button>
        </div>
        <p class="modal-sub">Pilih jenis pelukan yang mau kamu kirim sekarang:</p>
        <div class="hug-options">
            <button class="hug-opt-btn" data-type="Peluk Biasa 🤗">🤗 Peluk Biasa</button>
            <button class="hug-opt-btn" data-type="Peluk Lama 🫂">🫂 Peluk Lama</button>
            <button class="hug-opt-btn" data-type="Peluk Kangen 🥺">🥺 Peluk Karena Kangen</button>
            <button class="hug-opt-btn" data-type="Peluk Sayang ❤️">❤️ Peluk Sayang Banget</button>
        </div>
    </div>
</div>

<!-- MODAL DAILY CHECK (MOOD) -->
<div id="moodModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Perasaan Hari Ini 😊</h3>
            <button class="close-modal" id="closeMoodModal">✕</button>
        </div>
        <div class="mood-selector">
            <button class="mood-opt" data-mood="😊 Bahagia">😊</button>
            <button class="mood-opt" data-mood="🥰 Semangat">🥰</button>
            <button class="mood-opt" data-mood="😴 Lelah">😴</button>
            <button class="mood-opt" data-mood="😔 Sedih">😔</button>
            <button class="mood-opt" data-mood="🥺 Kangen">🥺</button>
        </div>
        <textarea id="moodNoteInput" placeholder="Ceritain sedikit hari ini... (misal: 'Capek kerjaan, tapi seneng inget kamu')"></textarea>
        <button id="btnSaveMood" class="btn-primary">Simpan Mood Hari Ini ➔</button>
    </div>
</div>
